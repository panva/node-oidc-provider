name: Release

permissions: {}

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

jobs:
  release:
    permissions:
      actions: read
      contents: write
      discussions: write
      id-token: write
    uses: panva/.github/.github/workflows/npm-release.yml@main
    with:
      artifact_check_command: node tools/test-dist.js "$PACKAGE_TARBALL"
      package_directory: ./dist
      prepare_command: npm clean-install --ignore-scripts && npm run build
